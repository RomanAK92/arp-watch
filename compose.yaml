services:
  arp-watch:
    build: .
    container_name: arp-watch
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 64
    tmpfs: [/tmp:size=16m]
    volumes:
      - ./config.json:/config/config.json:ro
      - ./data:/data
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: '3'}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/live', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
